databaseChangeLog:
  - changeSet:
      id: 001-create-post
      author: Tim
      changes:
        - createTable:
            tableName: posts
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: author_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: visibility
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE