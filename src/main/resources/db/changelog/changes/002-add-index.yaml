databaseChangeLog:
  - changeSet:
      id: 002-add-index
      author: Tim

      changes:
        - createIndex:
            indexName: idx_posts_author_id
            tableName: posts
            columns:
              - column:
                  name: author_id

        - createIndex:
            indexName: idx_posts_author_created_at
            tableName: posts
            columns:
              - column:
                  name: author_id
              - column:
                  name: created_at